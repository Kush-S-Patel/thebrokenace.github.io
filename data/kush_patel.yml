  - name: EEG Seizure-Marker Proximity Detection
    date: 2026
    tech:
      - PyTorch
      - EEG Conformer
      - MNE
      - AWS
      - Focal Loss
    metrics:
      pr_auc: 0.46
      roc_auc: 0.86
    bullets:
      - Built a patient-independent seizure detection pipeline on a 10.2 TB, 23,607-recording clinical EEG corpus (4,914 patients), from raw BIDS ingestion through a 244 GB preprocessed window cache with zero patient leakage across train/val/test splits
      - Trained an EEG Conformer with focal loss, improving PR-AUC from 0.082 (logistic regression baseline) to 0.46 and ROC-AUC to 0.86 through systematic benchmarking against EEGNet and classical baselines
      - Evaluated with clinically relevant metrics (event-level false alarms per 24h, precision at fixed recall) rather than accuracy alone, and ran a documented failure analysis isolating why preictal seizure forecasting stayed near chance
      - Open-sourced the pipeline with reproducible notebooks, clearly distinguishing the ML codebase from the dataset's own de-identification tooling
