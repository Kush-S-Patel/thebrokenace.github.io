    bullets:
      - Built a full-stack clinical decision-support platform for polysomnography (PSG) analysis on the Human Sleep Project dataset (119,000+ recordings from ~90,000 patients across five U.S. clinical centers)
      - Developed an interactive study-triage dashboard with AHI, OSA severity, clinical metrics, and review status, integrating automated and human-scored annotations, hypnograms, respiratory event timelines, signal previews, and epoch-level QC tools
