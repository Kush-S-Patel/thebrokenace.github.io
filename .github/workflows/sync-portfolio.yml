name: Sync Portfolio

on:
  schedule:
    # Every Sunday 16:00 UTC (~9am PT)
    - cron: "0 16 * * 0"
  workflow_dispatch:
  repository_dispatch:
    types: [autotailor-updated]
  push:
    paths:
      - "data/site.yml"
      - "data/kush_patel.yml"
      - "templates/**"
      - "sync/**"
      - ".github/workflows/sync-portfolio.yml"

permissions:
  contents: write

concurrency:
  group: sync-portfolio
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout portfolio
        uses: actions/checkout@v4

      - name: Checkout AutoTailor
        id: autotailor
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: Kush-S-Patel/AutoTailor
          path: AutoTailor
          # Required when AutoTailor is private (PAT with repo read)
          token: ${{ secrets.AUTOTAILOR_PAT || github.token }}

      - name: Resolve resume YAML source
        id: source
        run: |
          if [ -f AutoTailor/data/kush_patel.yml ]; then
            echo "yml=${{ github.workspace }}/AutoTailor/data/kush_patel.yml" >> "$GITHUB_OUTPUT"
            echo "Using checked-out AutoTailor YAML"
          elif [ -f data/kush_patel.yml ]; then
            echo "yml=${{ github.workspace }}/data/kush_patel.yml" >> "$GITHUB_OUTPUT"
            echo "::warning::AutoTailor checkout unavailable; using data/kush_patel.yml in this repo. Add AUTOTAILOR_PAT secret for live pulls from AutoTailor."
          else
            echo "::error::No kush_patel.yml found"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sync/requirements.txt

      - name: Install system deps (wkhtmltopdf + xvfb)
        run: |
          sudo apt-get update
          sudo apt-get install -y wkhtmltopdf xvfb

      - name: Install Python deps
        run: pip install -r sync/requirements.txt

      - name: Run sync
        env:
          AUTOTAILOR_RESUME_YML: ${{ steps.source.outputs.yml }}
          # HTML sync must succeed; PDF is best-effort under xvfb
          SYNC_REQUIRE_PDF: "false"
        run: xvfb-run -a python -m sync.sync

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html Kush_Patel_Resume.pdf data/kush_patel.yml || true
          if git diff --staged --quiet; then
            echo "No content changes to commit."
          else
            git commit -m "chore(sync): refresh site from AutoTailor"
            git push
          fi
