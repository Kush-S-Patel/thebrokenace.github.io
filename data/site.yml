linkedin_url: https://www.linkedin.com/in/kush-patel-053973216/

# Used as the headline on the untailored portfolio resume PDF
target_title: Software Engineer | Data Scientist

about:
  - My name is Kush Patel. I am a passionate programmer, visionary, and Data Science Master's student at UC Berkeley. I first started programming on Scratch when I was 9 years old, and published my first Apple application on the App Store at 12 years old.
  - I have skills and experience in a variety of programming languages including Python, Java, Swift, SwiftUI, Objective C, C++, and SQL. I also have a lot of experience in cybersecurity, Selenium, and knowledge about a variety of libraries in the mentioned languages.
  - As a team-player, I am an effective, efficient, and articulate leader. My analytical prowess combined with my unmatched problem-solving capacity makes me a valuable keystone in any group project. As the founder of two companies, my experience in working with other people has developed to the point where once a goal and team communication has been established, nothing is unachievable. I push myself to the absolute limit every day, and I find comfort in discomfort.
  - Ever since I could remember, I've used technology to solve problems. The most recent example that comes to mind is an automatic class registration tool that I wrote last year in Selenium and Chromium Web Driver (Java) to automatically sign up for my classes at UC Berkeley when the enrollment period started. The source code for this project is on my GitHub.
  - Feel free to check out some of my projects on GitHub, connect with me on LinkedIn, or email me if you'd like to chat!

interests:
  paragraphs:
    - When I'm not programming or learning, I like to hike, sing, play chess, game, garden, make art, and weightlift. Just last year I climbed Mission Peak in Fremont, at a peak altitude of 2,517 feet!
    - I also act (look forward to my newest film, <a href="https://williamkhuu.com/double-major">Double Major</a>), and make music! Below is a link to my Spotify and Apple Music artist page, look forward to more uploads in the future!
    - I also enjoy pushing the limits of cybersecurity in everyday life; I like to look at systems in place and see how possible it would be to exploit it. I am skilled at RFID manipulation, security analysis, and using my knowledge of vulnerabilities in software to gain an advantage (but not maliciously! :))
