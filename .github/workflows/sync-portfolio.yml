name: Sync Portfolio

on:
  schedule:
    # Every Sunday 16:00 UTC (~9am PT)
    - cron: "0 16 * * 0"
  workflow_dispatch:
  repository_dispatch:
    types: [autotailor-updated]
  push:
    paths:
      - "data/site.yml"
      - "templates/**"
      - "sync/**"
      - ".github/workflows/sync-portfolio.yml"

permissions:
  contents: write

concurrency:
  group: sync-portfolio
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout portfolio
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout AutoTailor
        uses: actions/checkout@v4
        with:
          repository: Kush-S-Patel/AutoTailor
          path: AutoTailor
          # Public AutoTailor works with github.token; private needs AUTOTAILOR_PAT
          token: ${{ secrets.AUTOTAILOR_PAT || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sync/requirements.txt

      - name: Install system deps (wkhtmltopdf)
        run: |
          sudo apt-get update
          sudo apt-get install -y wkhtmltopdf

      - name: Install Python deps
        run: pip install -r sync/requirements.txt

      - name: Run sync
        env:
          AUTOTAILOR_RESUME_YML: ${{ github.workspace }}/AutoTailor/data/kush_patel.yml
          SYNC_REQUIRE_PDF: "true"
        run: python -m sync.sync

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html Kush_Patel_Resume.pdf data/kush_patel.yml || true
          if git diff --staged --quiet; then
            echo "No content changes to commit."
          else
            git commit -m "chore(sync): refresh site from AutoTailor"
            git push
          fi
